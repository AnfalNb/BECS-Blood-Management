<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משתמשים - BECS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { background: #ff9800; color: white; padding: 20px; text-align: center; margin-bottom: 30px; }
        .back-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .actions { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-add { background: #4caf50; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn-add:hover { background: #388e3c; }
        .users-table { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #ff9800; color: white; padding: 12px; text-align: right; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f5f5f5; }
        .role-badge { padding: 4px 12px; border-radius: 12px; font-size: 0.85em; font-weight: bold; }
        .role-admin { background: #ff9800; color: white; }
        .role-user { background: #2196f3; color: white; }
        .role-researcher { background: #9c27b0; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; max-width: 500px; margin: 100px auto; }
        .modal-content h3 { color: #ff9800; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-submit { background: #4caf50; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; margin-left: 10px; }
        .btn-cancel { background: #f44336; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; }
        .message { padding: 15px; border-radius: 5px; margin-bottom: 20px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <header>
        <button class="back-btn" onclick="location.href='/'">← חזרה לתפריט ראשי</button>
        <h1>👥 ניהול משתמשים</h1>
        <p>הוספה ועריכת משתמשים במערכת</p>
    </header>
    
    <div class="container">
        <div id="message" class="message"></div>
        
        <div class="actions">
            <button class="btn-add" onclick="openModal()">➕ הוסף משתמש חדש</button>
        </div>
        
        <div class="users-table">
            <h3>רשימת משתמשים</h3>
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>מזהה</th>
                        <th>שם משתמש</th>
                        <th>שם מלא</th>
                        <th>אימייל</th>
                        <th>תפקיד</th>
                        <th>סטטוס</th>
                        <th>תאריך הצטרפות</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <tr><td colspan="7" style="text-align:center;">טוען...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3>הוסף משתמש חדש</h3>
            <form id="userForm">
                <div class="form-group">
                    <label>שם משתמש:</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>סיסמה:</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label>שם פרטי:</label>
                    <input type="text" id="first_name">
                </div>
                <div class="form-group">
                    <label>שם משפחה:</label>
                    <input type="text" id="last_name">
                </div>
                <div class="form-group">
                    <label>אימייל:</label>
                    <input type="email" id="email">
                </div>
                <div class="form-group">
                    <label>תפקיד:</label>
                    <select id="role" required>
                        <option value="USER">עובד בנק דם</option>
                        <option value="RESEARCHER">סטודנט מחקר</option>
                        <option value="ADMIN">אדמין</option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="btn-submit">צור משתמש</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">ביטול</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        loadUsers();
        
        async function loadUsers() {
            try {
                const response = await fetch('/api/users/');
                const data = await response.json();
                
                let html = '';
                data.users.forEach(user => {
                    let roleClass = 'role-user';
                    if (user.role === 'אדמין') roleClass = 'role-admin';
                    if (user.role === 'סטודנט מחקר') roleClass = 'role-researcher';
                    
                    html += `<tr>
                        <td>${user.id}</td>
                        <td><strong>${user.username}</strong></td>
                        <td>${user.full_name}</td>
                        <td>${user.email}</td>
                        <td><span class="role-badge ${roleClass}">${user.role}</span></td>
                        <td>${user.is_active ? '✓ פעיל' : '✗ לא פעיל'}</td>
                        <td>${user.date_joined}</td>
                    </tr>`;
                });
                
                document.getElementById('usersBody').innerHTML = html;
            } catch (error) {
                document.getElementById('usersBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">שגיאה בטעינת נתונים</td></tr>';
            }
        }
        
        function openModal() {
            document.getElementById('userModal').style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('userModal').style.display = 'none';
            document.getElementById('userForm').reset();
        }
        
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                email: document.getElementById('email').value,
                role: document.getElementById('role').value
            };
            
            try {
                const response = await fetch('/api/users/create/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    closeModal();
                    loadUsers();
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage('שגיאה ביצירת משתמש', 'error');
            }
        });
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
