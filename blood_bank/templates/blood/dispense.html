<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניפוק דם בשגרה - BECS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        header { background: #1565c0; color: white; padding: 20px; text-align: center; margin-bottom: 30px; }
        .back-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        .btn { background: #1565c0; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        .btn:hover { background: #0d47a1; }
        .message { padding: 15px; border-radius: 5px; margin-bottom: 20px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .alternatives { background: #fff3cd; padding: 20px; border-radius: 5px; margin-top: 20px; display: none; }
        .alternatives h3 { color: #856404; margin-bottom: 15px; }
        .alt-item { background: white; padding: 15px; margin: 10px 0; border-radius: 5px; border-right: 4px solid #ffc107; }
        .inventory { background: #e3f2fd; padding: 20px; border-radius: 5px; margin-top: 30px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .inventory-item { background: white; padding: 10px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <button class="back-btn" onclick="location.href='/'">← חזרה לתפריט ראשי</button>
        <h1>🏥 ניפוק דם בשגרה</h1>
    </header>
    
    <div class="container">
        <div id="message" class="message"></div>
        
        <div class="form-container">
            <form id="dispenseForm">
                <div class="form-group">
                    <label for="blood_type">סוג דם מבוקש:</label>
                    <select id="blood_type" required>
                        <option value="">-- בחר סוג דם --</option>
                        <option value="A+">A+</option>
                        <option value="O+">O+</option>
                        <option value="B+">B+</option>
                        <option value="AB+">AB+</option>
                        <option value="A-">A-</option>
                        <option value="O-">O-</option>
                        <option value="B-">B-</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="quantity">כמות מנות:</label>
                    <input type="number" id="quantity" min="1" value="1" required>
                </div>
                
                <button type="submit" class="btn">בצע ניפוק</button>
            </form>
        </div>
        
        <div id="alternatives" class="alternatives">
            <h3>⚠️ סוגי דם אלטרנטיביים זמינים</h3>
            <div id="altList"></div>
        </div>
        
        <div class="inventory">
            <h3>מלאי נוכחי במאגר</h3>
            <div id="inventory" class="inventory-grid"></div>
        </div>
    </div>
    
    <script>
        loadInventory();
        
        document.getElementById('dispenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                blood_type: document.getElementById('blood_type').value,
                quantity: document.getElementById('quantity').value
            };
            
            try {
                const response = await fetch('/api/dispense/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    document.getElementById('alternatives').style.display = 'none';
                    loadInventory();
                } else {
                    showMessage(result.message, 'warning');
                    showAlternatives(result.alternatives);
                }
            } catch (error) {
                showMessage('שגיאה בתקשורת עם השרת', 'error');
            }
        });
        
        async function loadInventory() {
            try {
                const response = await fetch('/api/inventory/');
                const inventory = await response.json();
                
                let html = '';
                for (const [type, count] of Object.entries(inventory)) {
                    html += `<div class="inventory-item"><strong>${type}</strong><span>${count} מנות</span></div>`;
                }
                document.getElementById('inventory').innerHTML = html;
            } catch (error) {
                console.error('Error loading inventory:', error);
            }
        }
        
        function showAlternatives(alternatives) {
            if (!alternatives || alternatives.length === 0) {
                document.getElementById('alternatives').style.display = 'none';
                return;
            }
            
            let html = '';
            alternatives.forEach(alt => {
                html += `
                    <div class="alt-item">
                        <strong>סוג דם: ${alt.blood_type}</strong><br>
                        זמין: ${alt.available} מנות<br>
                        שכיחות באוכלוסייה: ${alt.rarity}%
                    </div>
                `;
            });
            
            document.getElementById('altList').innerHTML = html;
            document.getElementById('alternatives').style.display = 'block';
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
