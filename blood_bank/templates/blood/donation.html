<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קליטת תרומות דם - BECS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        header { background: #c62828; color: white; padding: 20px; text-align: center; margin-bottom: 30px; }
        .back-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        input:focus, select:focus { outline: none; border-color: #c62828; }
        .btn { background: #c62828; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        .btn:hover { background: #b71c1c; }
        .message { padding: 15px; border-radius: 5px; margin-bottom: 20px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .inventory { background: #e3f2fd; padding: 20px; border-radius: 5px; margin-top: 30px; }
        .inventory h3 { color: #1565c0; margin-bottom: 15px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .inventory-item { background: white; padding: 10px; border-radius: 5px; text-align: center; }
        .inventory-item strong { display: block; color: #c62828; font-size: 1.2em; }
    </style>
</head>
<body>
    <header>
        <button class="back-btn" onclick="location.href='/'">← חזרה לתפריט ראשי</button>
        <h1>💉 קליטת תרומות דם</h1>
    </header>
    
    <div class="container">
        <div id="message" class="message"></div>
        
        <div class="form-container">
            <form id="donationForm">
                <div class="form-group">
                    <label for="blood_type">סוג דם:</label>
                    <select id="blood_type" required>
                        <option value="">-- בחר סוג דם --</option>
                        <option value="A+">A+</option>
                        <option value="O+">O+</option>
                        <option value="B+">B+</option>
                        <option value="AB+">AB+</option>
                        <option value="A-">A-</option>
                        <option value="O-">O-</option>
                        <option value="B-">B-</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="donation_date">תאריך תרומה:</label>
                    <input type="date" id="donation_date" required>
                </div>
                
                <div class="form-group">
                    <label for="donor_id">מספר ת"ז:</label>
                    <input type="text" id="donor_id" pattern="\d{9}" maxlength="9" placeholder="9 ספרות" required>
                </div>
                
                <div class="form-group">
                    <label for="donor_name">שם מלא:</label>
                    <input type="text" id="donor_name" placeholder="שם פרטי ושם משפחה" required>
                </div>
                
                <button type="submit" class="btn">קלוט תרומה</button>
            </form>
        </div>
        
        <div class="inventory">
            <h3>מלאי נוכחי במאגר</h3>
            <div id="inventory" class="inventory-grid"></div>
        </div>
    </div>
    
    <script>
        document.getElementById('donation_date').valueAsDate = new Date();
        
        loadInventory();
        
        document.getElementById('donationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                blood_type: document.getElementById('blood_type').value,
                donation_date: document.getElementById('donation_date').value,
                donor_id: document.getElementById('donor_id').value,
                donor_name: document.getElementById('donor_name').value
            };
            
            try {
                const response = await fetch('/api/donation/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    document.getElementById('donationForm').reset();
                    document.getElementById('donation_date').valueAsDate = new Date();
                    loadInventory();
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage('שגיאה בתקשורת עם השרת', 'error');
            }
        });
        
        async function loadInventory() {
            try {
                const response = await fetch('/api/inventory/');
                const inventory = await response.json();
                
                let html = '';
                for (const [type, count] of Object.entries(inventory)) {
                    html += `<div class="inventory-item"><strong>${type}</strong><span>${count} מנות</span></div>`;
                }
                document.getElementById('inventory').innerHTML = html;
            } catch (error) {
                console.error('Error loading inventory:', error);
            }
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
