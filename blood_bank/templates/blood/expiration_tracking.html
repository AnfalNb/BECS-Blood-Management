<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב תוקף מנות - BECS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); color: white; padding: 20px; text-align: center; margin-bottom: 30px; border-radius: 8px; }
        .back-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; text-decoration: none; display: inline-block; }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .stat-card h3 { font-size: 2.5em; margin-bottom: 10px; }
        .stat-card p { color: #666; font-size: 0.95em; }
        .stat-expired h3 { color: #f44336; }
        .stat-soon h3 { color: #ff9800; }
        .stat-medium h3 { color: #ffc107; }
        .stat-ok h3 { color: #4caf50; }
        
        .actions-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.3s; }
        .btn-refresh { background: #2196f3; color: white; }
        .btn-refresh:hover { background: #1976d2; }
        .btn-remove-expired { background: #f44336; color: white; }
        .btn-remove-expired:hover { background: #d32f2f; }
        .btn-export { background: #4caf50; color: white; }
        .btn-export:hover { background: #388e3c; }
        
        .content-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(600px, 1fr)); gap: 20px; }
        .panel { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .panel h3 { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #eee; }
        .panel-expired h3 { color: #f44336; border-color: #f44336; }
        .panel-soon h3 { color: #ff9800; border-color: #ff9800; }
        
        .list-item { padding: 15px; margin-bottom: 10px; border-radius: 8px; background: #f9f9f9; border-right: 4px solid; }
        .list-item-expired { border-color: #f44336; background: #ffebee; }
        .list-item-soon { border-color: #ff9800; background: #fff3e0; }
        .list-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .blood-type { font-size: 1.3em; font-weight: bold; }
        .donor-name { color: #666; }
        .days-info { font-weight: bold; }
        .days-expired { color: #f44336; }
        .days-left { color: #ff9800; }
        .btn-mark { background: #f44336; color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
        .btn-mark:hover { background: #d32f2f; }
        
        .blood-type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 15px; }
        .blood-type-card { background: #f5f5f5; padding: 15px; border-radius: 8px; text-align: center; }
        .blood-type-card h4 { color: #c62828; font-size: 1.5em; margin-bottom: 8px; }
        .blood-type-card .detail { font-size: 0.9em; color: #666; margin: 5px 0; }
        
        .no-data { text-align: center; padding: 40px; color: #999; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .message { padding: 15px; border-radius: 5px; margin-bottom: 20px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="back-btn">← חזרה לתפריט ראשי</a>
        <h1>⏰ מעקב תוקף מנות דם</h1>
        <p>ניהול תוקף ומניעת בזבוז</p>
    </header>
    
    <div class="container">
        <div id="message" class="message"></div>
        
        <!-- סטטיסטיקות -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="statTotal">0</h3>
                <p>סך מנות זמינות</p>
            </div>
            <div class="stat-card stat-expired">
                <h3 id="statExpired">0</h3>
                <p>🚫 פג תוקף</p>
            </div>
            <div class="stat-card stat-soon">
                <h3 id="statSoon">0</h3>
                <p>⚠️ תפוגה תוך 7 ימים</p>
            </div>
            <div class="stat-card stat-medium">
                <h3 id="statMedium">0</h3>
                <p>⏳ תפוגה תוך 7-14 ימים</p>
            </div>
            <div class="stat-card stat-ok">
                <h3 id="statOk">0</h3>
                <p>✓ תקין (מעל 14 ימים)</p>
            </div>
        </div>
        
        <!-- פעולות -->
        <div class="actions-panel">
            <button class="btn btn-refresh" onclick="loadData()">🔄 רענן נתונים</button>
            <button class="btn btn-remove-expired" onclick="batchRemoveExpired()">🗑️ הסר כל המנות שפג תוקפן</button>
            <button class="btn btn-export" onclick="exportReport()">📥 ייצא דוח תפוגה</button>
        </div>
        
        <!-- תוכן -->
        <div class="content-grid">
            <!-- מנות שפג תוקפן -->
            <div class="panel panel-expired">
                <h3>🚫 מנות שפג תוקפן ({<span id="expiredCount">0</span>})</h3>
                <div id="expiredList" class="loading">טוען...</div>
            </div>
            
            <!-- מנות שתפוגתן מתקרבת -->
            <div class="panel panel-soon">
                <h3>⚠️ מנות קרובות לפקיעה - 7 ימים ({<span id="soonCount">0</span>})</h3>
                <div id="soonList" class="loading">טוען...</div>
            </div>
        </div>
        
        <!-- פילוח לפי סוג דם -->
        <div class="panel" style="margin-top: 20px;">
            <h3>📊 פילוח לפי סוג דם</h3>
            <div id="bloodTypeBreakdown" class="blood-type-grid"></div>
        </div>
    </div>
    
    <script>
        loadData();
        
        // רענון אוטומטי כל 5 דקות
        setInterval(loadData, 300000);
        
        async function loadData() {
            try {
                const response = await fetch('/api/expiration-data/');
                const data = await response.json();
                
                updateStats(data.stats);
                displayExpiredList(data.expired_list);
                displayExpiringList(data.expiring_list);
                displayBloodTypeBreakdown(data.by_blood_type);
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        function updateStats(stats) {
            document.getElementById('statTotal').textContent = stats.total_available;
            document.getElementById('statExpired').textContent = stats.expired;
            document.getElementById('statSoon').textContent = stats.expiring_soon;
            document.getElementById('statMedium').textContent = stats.expiring_medium;
            document.getElementById('statOk').textContent = stats.ok;
            
            document.getElementById('expiredCount').textContent = stats.expired;
            document.getElementById('soonCount').textContent = stats.expiring_soon;
        }
        
        function displayExpiredList(list) {
            const container = document.getElementById('expiredList');
            
            if (list.length === 0) {
                container.innerHTML = '<div class="no-data">✓ אין מנות שפג תוקפן</div>';
                return;
            }
            
            let html = '';
            list.forEach(item => {
                html += `
                    <div class="list-item list-item-expired">
                        <div class="list-item-header">
                            <div>
                                <span class="blood-type">${item.blood_type}</span>
                                <span class="donor-name">${item.donor_name}</span>
                            </div>
                            <button class="btn-mark" onclick="markExpired(${item.id})">הסר</button>
                        </div>
                        <div>
                            <strong>תאריך תרומה:</strong> ${item.donation_date}<br>
                            <strong>תאריך תפוגה:</strong> ${item.expiration_date}<br>
                            <span class="days-expired">פג לפני ${item.days_expired} ימים</span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function displayExpiringList(list) {
            const container = document.getElementById('soonList');
            
            if (list.length === 0) {
                container.innerHTML = '<div class="no-data">✓ אין מנות קרובות לפקיעה</div>';
                return;
            }
            
            let html = '';
            list.forEach(item => {
                html += `
                    <div class="list-item list-item-soon">
                        <div class="list-item-header">
                            <div>
                                <span class="blood-type">${item.blood_type}</span>
                                <span class="donor-name">${item.donor_name}</span>
                            </div>
                            <span class="days-left">${item.days_left} ימים</span>
                        </div>
                        <div>
                            <strong>תאריך תרומה:</strong> ${item.donation_date}<br>
                            <strong>תאריך תפוגה:</strong> ${item.expiration_date}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function displayBloodTypeBreakdown(data) {
            const container = document.getElementById('bloodTypeBreakdown');
            let html = '';
            
            for (const [type, stats] of Object.entries(data)) {
                html += `
                    <div class="blood-type-card">
                        <h4>${type}</h4>
                        <div class="detail">סה"כ: ${stats.total}</div>
                        <div class="detail" style="color:#f44336">פגות: ${stats.expired}</div>
                        <div class="detail" style="color:#ff9800">קרובות: ${stats.expiring_soon}</div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        async function markExpired(donationId) {
            if (!confirm('האם לסמן מנה זו כפגה ולהסיר מהמלאי?')) return;
            
            try {
                const response = await fetch('/api/mark-expired/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({donation_id: donationId})
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    loadData();
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage('שגיאה בהסרת המנה', 'error');
            }
        }
        
        async function batchRemoveExpired() {
            if (!confirm('האם להסיר את כל המנות שפג תוקפן מהמלאי? פעולה זו בלתי הפיכה!')) return;
            
            try {
                const response = await fetch('/api/batch-remove-expired/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(`✓ ${result.message}`, 'success');
                    loadData();
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage('שגיאה בהסרת מנות', 'error');
            }
        }
        
        function exportReport() {
            window.location.href = '/export/expiration-report/';
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
