<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - BECS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #c62828; font-size: 2.5em; margin-bottom: 10px; }
        .logo p { color: #666; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; transition: border 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        .btn-login { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: transform 0.2s; }
        .btn-login:hover { transform: translateY(-2px); }
        .messages { margin-bottom: 20px; }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 10px; }
        .alert-error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .footer { text-align: center; margin-top: 20px; color: #666; font-size: 0.9em; }
        .hipaa-badge { background: #4caf50; color: white; padding: 5px 15px; border-radius: 20px; display: inline-block; margin-top: 15px; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🩸 BECS</h1>
            <p>Blood Establishment Computer Software</p>
            <span class="hipaa-badge">🔒 HIPAA Compliant</span>
        </div>
        
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">שם משתמש:</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">סיסמה:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn-login">התחבר</button>
        </form>
        
        <div class="footer">
            <p>מערכת מאובטחת עם תמיכה ב-PART 11 ו-HIPAA</p>
        </div>
    </div>
</body>
</html>
